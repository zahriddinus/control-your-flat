<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <!-- SVG zamonaviy brauzerlar uchun, ICO eski brauzerlar uchun -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="32x32" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <!-- viewport-fit=cover: iPhone'da pastki menyu ekran chetigacha cho'ziladi -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Mavzu React yuklanishidan oldin qo'llanadi, aks holda bir lahza oq ekran yaltiraydi.
         Keyin src/hooks/useTheme.js boshqaradi. Avto: 06:00-18:00 yorug', qolgan vaqt qorong'i -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          var hour = new Date().getHours();
          var isNight = hour < 6 || hour >= 18;
          var isDark = theme === "dark" || (theme !== "light" && isNight);

          document.documentElement.setAttribute("data-bs-theme", isDark ? "dark" : "light");
        } catch (error) {}
      })();
    </script>
    <meta
      name="description"
      content="Xonadon navbatlari: navbatchilik, musor va generalniy uborka bir joyda"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!-- iPhone'da bosh ekrandan ilovadek (brauzer panelisiz) ochilishi uchun -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Your Flat" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Control Your Flat</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
